name: Android Build & Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build_android:
    runs-on: macos-latest
    # Secrets are not readable in step `if:`; expose their presence via job env.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (API 36)
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/keystore.jks

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.0.0
        with:
          versionSpec: "5.x"

      - name: Determine Version via GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.0.0
        with:
          useConfigFile: false

      - name: Update package.json Version
        run: |
          sed -i.bak "s|\"version\": \"[0-9\.]*\"|\"version\": \"${{ steps.gitversion.outputs.semVer }}\"|" package.json

      - name: Update sw.js Version
        run: |
          sed -i.bak "s|OpenSprinkler-v[0-9\.]*|OpenSprinkler-v${{ steps.gitversion.outputs.semVer }}|" www/sw.js

      - name: Update main.js App Version
        run: |
          sed -i.bak "s|appVersion: '[0-9\.]*'|appVersion: '${{ steps.gitversion.outputs.semVer }}'|" www/js/main.js

      # config.xml is the single source of truth for android-versionCode (bumped by hand per
      # release, same as the local build.sh flow). The former GitVersion-derived code
      # (major*10000+minor*100+patch, currently ~11377) would jump far ahead of the Play
      # Console history and lock out every later local build.
      - name: Update config.xml version name
        run: |
          sed -i.bak "s|version=\"[0-9\.]*\"|version=\"${{ steps.gitversion.outputs.majorMinorPatch }}\"|" config.xml
          grep -o 'android-versionCode="[0-9]*"' config.xml

      - name: Cache Node Modules
        id: cache_npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        if: steps.cache_npm.outputs.cache-hit != 'true'
        run: npm install

      - name: Add Android Platform
        run: npx cordova platform add android

      - name: Build Android Release AAB (signed)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          npx cordova build android --release -- --keystore=${{ runner.temp }}/keystore.jks --storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} --alias=${{ secrets.ANDROID_KEY_ALIAS || 'opensprinklerpro' }} --password=${{ secrets.ANDROID_KEY_PASSWORD }} --packageType=bundle

      - name: Build Android Release AAB (unsigned, no keystore secret configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::notice::ANDROID_KEYSTORE_BASE64 not set - building unsigned AAB as a compile check only"
          # build.json is untracked (signing material); if one exists anyway, keep cordova from reading it.
          [ -f build.json ] && mv build.json build.json.local || true
          npx cordova build android --release -- --packageType=bundle

      - name: Upload unsigned AAB as workflow artifact
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned.aab
          path: platforms/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload to Google Play Internal Testing
        if: env.HAS_KEYSTORE == 'true' && env.HAS_PLAY_SA == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.opensprinklershop.sprinklers
          releaseFiles: platforms/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
