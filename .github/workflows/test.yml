name: Unit Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Dependencies
        id: cache_npm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        if: steps.cache_npm.outputs.cache-hit != 'true'
        run: npm install

      - name: Run test steps
        # Use the project's grunt (devDependency); the Ubuntu 26 runner image
        # (ubuntu-latest since 2026-10-19) no longer ships a global grunt-cli,
        # the bare "grunt" failed with exit 127 on every run since 23.10.2026.
        run: |
          npx grunt
          npm run test
